<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bharat Singh Rawat, Ph.D.</title>
    <script src="js/parallax.js"></script>
    <script src="js/jukebox.js" defer></script>

    <style>
        :root {
            --plasma-cyan: #00ffff;
            --vacuum-black: #020205;
            --magnet-north: #ff3e3e;
            --magnet-south: #3e66ff;
            --phosphor-green: #00ff41;
            --warning-orange: #ffae00;
            --extraction-purple: #bc13fe;
            --electron-gold: #fff176;
            --current-beam-color: var(--plasma-cyan);
            --plasma-intensity: 0.78;
            --plasma-hue: 275;
        }
        body, html {
            margin: 0; padding: 0;
            background-color: var(--vacuum-black);
            color: #d1d1d1;
            font-family: 'Fira Code', monospace;
            overflow-x: hidden;
            scroll-behavior: smooth;
            touch-action: pan-y;
            cursor: default;
        }

        /* --- CRT & VIDEO OVERLAY STYLES --- */
        #video-intro-container {
            position: fixed;
            inset: 0;
            z-index: 1000000;
            background: var(--vacuum-black);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1), visibility 1.2s;
        }

        #intro-video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            filter: saturate(1.2) contrast(1.1);
        }

        #crt-filter {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 255, 0, 0.03));
            background-size: 100% 4px, 3px 100%;
            z-index: 2;
        }

        #enter-system-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.8) 90%);
            z-index: 3;
            backdrop-filter: blur(2px);
        }

        #initialize-button {
            background: transparent;
            color: var(--phosphor-green);
            border: 2px solid var(--phosphor-green);
            padding: 20px 40px;
            font-family: 'Fira Code', monospace;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0,255,65,0.4);
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }
        #initialize-button:hover { 
            background: var(--phosphor-green); 
            color: #000; 
            box-shadow: 0 0 50px var(--phosphor-green);
            animation: flicker 0.15s infinite; 
        }

        .preloader-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            filter: brightness(2) blur(20px);
        }

        /* --- BOOT SEQUENCE LOG --- */
        #boot-log {
            display: none;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            line-height: 1.35;
            color: var(--phosphor-green);
            text-shadow: 0 0 8px rgba(0,255,65,0.55);
            min-width: min(640px, 86vw);
            max-width: 86vw;
            padding: 22px 26px;
            background: rgba(0,12,0,0.55);
            border: 1px solid rgba(0,255,65,0.35);
            border-left: 3px solid var(--phosphor-green);
            box-shadow: 0 0 30px rgba(0,255,65,0.15), inset 0 0 60px rgba(0,255,65,0.04);
            backdrop-filter: blur(2px);
        }
        #boot-log.active { display: flex; }
        .boot-line {
            white-space: nowrap;
            opacity: 0;
            transform: translateX(-6px);
            animation: boot-fade-in 0.18s ease-out forwards;
        }
        .boot-prefix { color: #5b6d5b; }
        .boot-label  { color: var(--plasma-cyan); }
        .boot-dots   { color: #2e3d2e; letter-spacing: 1px; }
        .boot-value  { color: var(--electron-gold); }
        .boot-ok     { color: var(--phosphor-green); margin-left: 6px; }
        .boot-fail   { color: var(--magnet-north); margin-left: 6px; }
        .boot-ignition {
            margin-top: 12px;
            color: var(--warning-orange);
            text-shadow: 0 0 12px var(--warning-orange), 0 0 24px rgba(255,174,0,0.5);
            font-weight: bold;
            letter-spacing: 2px;
            animation: boot-ignite 0.7s ease-out forwards;
        }
        @keyframes boot-fade-in {
            from { opacity: 0; transform: translateX(-8px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        @keyframes boot-ignite {
            0%   { opacity: 0; filter: blur(8px) brightness(0.4); transform: scale(0.96); }
            55%  { opacity: 1; filter: blur(0)   brightness(2.2); transform: scale(1.02); }
            100% { opacity: 1; filter: none;                       transform: scale(1); }
        }
        @media (max-width: 850px) {
            #boot-log { font-size: 0.65rem; padding: 14px 16px; }
            .boot-line { white-space: normal; }
        }

        /* --- GUIDED TOUR --- */
        #tour-btn {
            display: block;
            width: 100%;
            margin-top: 12px;
            padding: 6px 8px;
            background: rgba(0,0,0,0.6);
            border: 1px solid var(--phosphor-green);
            color: var(--phosphor-green);
            font-family: 'Fira Code', monospace;
            font-size: 0.6rem;
            letter-spacing: 1px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.2s;
        }
        #tour-btn:hover {
            background: rgba(0,255,65,0.15);
            box-shadow: 0 0 12px var(--phosphor-green);
        }
        #tour-btn.tour-running {
            border-color: var(--magnet-north);
            color: var(--magnet-north);
            box-shadow: 0 0 12px var(--magnet-north);
        }

        #tour-caption {
            position: fixed;
            left: 50%;
            bottom: 36px;
            transform: translateX(-50%) translateY(20px);
            background: rgba(0,12,0,0.92);
            border: 1px solid var(--phosphor-green);
            border-left: 3px solid var(--phosphor-green);
            color: #d8ffd8;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            line-height: 1.45;
            padding: 14px 22px;
            max-width: min(620px, 90vw);
            box-shadow: 0 0 24px rgba(0,255,65,0.25);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s, transform 0.4s;
            z-index: 100002;
            text-align: center;
        }
        #tour-caption.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        #tour-caption .tour-prefix {
            color: var(--warning-orange);
            margin-right: 8px;
            font-weight: bold;
        }
        #tour-caption .tour-hint {
            display: block;
            margin-top: 8px;
            font-size: 0.65rem;
            color: #5b6d5b;
            letter-spacing: 1px;
        }

        /* Pulsing ring drawn at the cursor's current target during tour */
        body.tour-active #ring-cusp-cursor {
            filter: drop-shadow(0 0 18px var(--phosphor-green)) drop-shadow(0 0 32px var(--plasma-cyan));
        }

        /* --- CHESS KNIGHT EASTER EGG --- */
        .knight-ghost {
            position: fixed;
            font-size: 2rem;
            color: var(--electron-gold);
            text-shadow: 0 0 14px var(--plasma-cyan), 0 0 28px var(--electron-gold);
            pointer-events: none;
            z-index: 100001;
            user-select: none;
            animation: knight-l-jump 1.6s cubic-bezier(0.5, 0, 0.3, 1) forwards;
        }
        @keyframes knight-l-jump {
            0%   { transform: translate(0, 0)      scale(1)   rotate(0deg); opacity: 0; }
            10%  { transform: translate(0, 0)      scale(1.5) rotate(0deg); opacity: 1; }
            48%  { transform: translate(190px, 0)  scale(1.5) rotate(15deg); opacity: 1; }
            55%  { transform: translate(190px, 0)  scale(1.5) rotate(0deg); opacity: 1; }
            92%  { transform: translate(190px, -110px) scale(1.5) rotate(-12deg); opacity: 1; }
            100% { transform: translate(190px, -110px) scale(0.5) rotate(0deg); opacity: 0; }
        }
        .knight-trail-dot {
            position: fixed;
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--electron-gold);
            box-shadow: 0 0 8px var(--electron-gold), 0 0 16px var(--plasma-cyan);
            pointer-events: none;
            z-index: 100000;
            animation: knight-dot-fade 1.2s ease-out forwards;
        }
        @keyframes knight-dot-fade {
            0%   { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.2); }
        }
        .hobby-atom.knight-cooldown { cursor: wait; opacity: 0.6; }

        /* --- UI COMPONENT PLACEMENT --- */
        #control-panel {
            position: fixed; 
            top: 20px;     
            left: 20px;
            background: rgba(0,0,0,0.92);
            border: 1px solid var(--plasma-cyan);
            padding: 15px; z-index: 9999;
            pointer-events: all; border-radius: 5px;
            box-shadow: 0 0 20px rgba(0,255,255,0.2);
            cursor: grab;
            user-select: none;
            transition: transform 0.1s ease-out;
        }
        
        #jukebox-card {
            position: fixed !important;
            top: 20px !important;
            right: 20px !important;
            left: auto !important;
            z-index: 9999;
        }

        #bg-canvas { position: fixed; inset: 0; z-index: -2; pointer-events: none; background-color: var(--vacuum-black);}
        #ui-grid {
            position: fixed; inset: 0;
            background-image:
                linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1; pointer-events: none;
        }
        #control-panel:active { cursor: grabbing; }
        input[type=range] { accent-color: var(--plasma-cyan); width: 140px; cursor: pointer; display: block; margin: 5px 0 10px; }
        
        #ring-cusp-cursor {
            position: fixed; width: 400px; height: 200px;
            pointer-events: none; z-index: 100000;
            transform: translate(-66px, -100px);
        }
        #ion-beam-canvas { position: absolute; inset: 0; pointer-events: none; z-index: 6; }
        #electron-canvas { position: absolute; inset: 0; pointer-events: none; z-index: 7; }
        #erosion-canvas  { position: absolute; inset: 0; pointer-events: none; z-index: 5; }

        /* Anode back-plate */
        .anode-plate {
            position: absolute; top: 30px; left: 0;
            width: 6px; height: 142px;
            background: linear-gradient(to right, #2a2a30, #4a4a52);
            border-right: 1px solid #6a6a72;
            border-radius: 2px 0 0 2px;
        }
        /* Discharge chamber body */
        .chamber-body {
            position: absolute; top: 28px; left: 4px;
            width: 124px; height: 144px;
            background: linear-gradient(135deg, rgba(28,28,42,0.96), rgba(14,14,24,0.96));
            border: 1.5px solid #585866;
            border-right: none;
            border-radius: 6px 0 0 6px;
            box-shadow:
                inset 0 0 24px rgba(0,255,255,0.05),
                inset 2px 0 4px rgba(0,0,0,0.6);
        }
        /* Plasma fill — brightness scales with EXTRACTION_V, hue shifts with NEUTRALIZER_I */
        .chamber-plasma {
            position: absolute; top: 38px; left: 12px;
            width: 110px; height: 124px;
            background: radial-gradient(ellipse at 65% 50%,
                hsla(var(--plasma-hue), 95%, 65%, calc(var(--plasma-intensity) * 0.34)) 0%,
                hsla(var(--plasma-hue), 80%, 50%, calc(var(--plasma-intensity) * 0.18)) 45%,
                transparent 80%);
            border-radius: 4px 0 0 4px;
            pointer-events: none;
            animation: plasma-pulse 2.4s ease-in-out infinite;
            mix-blend-mode: screen;
            transition: background 0.18s ease;
            z-index: 2;
        }
        @keyframes plasma-pulse {
            0%,100% { opacity: 0.65; transform: scale(1); }
            50%     { opacity: 1.0;  transform: scale(1.02); }
        }
        /* Hollow cathode inside chamber */
        .hollow-cathode {
            position: absolute; top: 92px; left: 14px;
            width: 14px; height: 16px;
            background: linear-gradient(135deg, #3a3a44, #1a1a22);
            border: 1px solid #5a5a62;
            border-radius: 2px;
            z-index: 3;
        }
        .hollow-cathode::after {
            content: '';
            position: absolute;
            top: 5px; right: -4px;
            width: 5px; height: 6px;
            background: radial-gradient(circle, #ffd070 0%, #ff7020 60%, transparent 100%);
            border-radius: 0 50% 50% 0;
            box-shadow: 0 0 8px rgba(255,180,80,0.8);
            animation: cathode-glow 1.6s ease-in-out infinite;
        }
        @keyframes cathode-glow {
            0%,100% { opacity: 0.85; }
            50%     { opacity: 1; box-shadow: 0 0 12px rgba(255,200,100,1); }
        }

        /* Cusp magnets */
        .magnet {
            position: absolute;
            width: 14px; height: 8px;
            border: 1px solid #1a1a1a;
            border-radius: 1.5px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.6);
            z-index: 4;
        }
        .magnet.back { width: 8px; height: 14px; }
        .north { background: linear-gradient(to bottom, #ff5e5e, #b22222); }
        .south { background: linear-gradient(to bottom, #5e7eff, #2244aa); }
        .back.north { background: linear-gradient(to right, #ff5e5e, #b22222); }
        .back.south { background: linear-gradient(to right, #5e7eff, #2244aa); }

        /* Two-grid extraction stack — period 18px, apertures aligned */
        .grid {
            position: absolute;
            top: 28px;
            width: 5px;
            height: 144px;
            border-radius: 1px;
            z-index: 4;
        }
        .screen-grid {
            left: 132px;
            background: repeating-linear-gradient(
                to bottom,
                rgba(180,210,255,0.95) 0 3px,
                transparent 3px 15px,
                rgba(180,210,255,0.95) 15px 18px
            );
            box-shadow: 0 0 5px rgba(120,180,255,0.55);
        }
        .accel-grid {
            left: 146px;
            background: repeating-linear-gradient(
                to bottom,
                rgba(140,90,90,0.95) 0 5px,
                transparent 5px 13px,
                rgba(140,90,90,0.95) 13px 18px
            );
            box-shadow: 0 0 5px rgba(255,80,80,0.4);
        }

        /* Wear stats inside control panel */
        #wear-readout {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px dashed #333;
            font-size: 0.55rem;
            color: var(--phosphor-green);
            line-height: 1.6;
        }
        #wear-readout .wear-row { display: flex; justify-content: space-between; }
        #wear-readout .wear-label { color: #888; }
        #reset-chamber-btn {
            display: block; width: 100%; margin-top: 8px;
            padding: 5px 6px;
            background: rgba(0,0,0,0.6);
            border: 1px solid var(--magnet-north);
            color: var(--magnet-north);
            font-family: 'Fira Code', monospace;
            font-size: 0.55rem; letter-spacing: 1px;
            cursor: pointer; text-transform: uppercase;
            transition: 0.2s;
        }
        #reset-chamber-btn:hover {
            background: rgba(255,62,62,0.15);
            box-shadow: 0 0 10px var(--magnet-north);
        }
      
        #diagnostic-hud {
            position: fixed; bottom: 20px; right: 20px; width: 200px; background: rgba(0, 10, 0, 0.95);
            border: 1px solid var(--phosphor-green); padding: 12px; opacity: 0; transition: 0.3s; z-index: 9999;
            border-radius: 4px; pointer-events: none;
        }
        #diagnostic-hud.active { opacity: 1; }
        .diag-label { color: var(--phosphor-green); font-size: 0.6rem; margin-bottom: 4px; text-transform: uppercase;}
      
        .container { max-width: 950px; margin: 0 auto; padding: 120px 20px 100px; position: relative; z-index: 10; pointer-events: none; }
        .lab-card {
            background: rgba(10, 10, 15, 0.94); border: 1px solid #222; border-left: 4px solid var(--plasma-cyan);
            padding: 30px; margin-bottom: 40px; pointer-events: all;
            transition: all 0.3s ease, transform 0.1s ease-out;
            transform-style: preserve-3d;
        }
        
        @media (hover: hover) and (pointer: fine) {
            .lab-card:hover { box-shadow: 0 0 30px rgba(0, 255, 255, 0.25); transform: translateY(-3px); }
            .lab-card:hover h1 { color: #ffdd00; text-shadow: 0 0 12px #ffae00, 0 0 24px #00ffff; }
            .lab-card:hover h2.module-title { color: #ffae00; text-shadow: 0 0 10px #ffae00, 0 0 20px rgba(255,174,0,0.6); }
            .lab-card:hover .sub-role { color: #00ffff; text-shadow: 0 0 8px #00ffff, 0 0 16px rgba(0,255,255,0.5); }
            .lab-card:hover .date-tag { color: #bc13fe; text-shadow: 0 0 6px #bc13fe; }
            .lab-card:hover p, .lab-card:hover li { color: #e0ffff; text-shadow: 0 0 6px rgba(0,255,255,0.4); }
            .lab-card:hover .pub-box { border-left-color: #bc13fe; background: rgba(188,19,254,0.08); box-shadow: 0 0 12px rgba(188,19,254,0.4); color: #e0ccff; }
            .lab-card:hover .btn-game { box-shadow: 0 0 12px var(--bc, var(--warning-orange)); }
            .btn-game:hover { background: var(--bc, var(--warning-orange)); color: #000; box-shadow: 0 0 20px var(--bc, var(--warning-orange)); transform: scale(1.05); }
        }

        /* Visual Pulse Animation */
        @keyframes border-pulse {
            0% { border-left-color: var(--plasma-cyan); box-shadow: 0 0 0px var(--phosphor-green); }
            50% { border-left-color: var(--phosphor-green); box-shadow: 0 0 25px var(--phosphor-green); }
            100% { border-left-color: var(--plasma-cyan); box-shadow: 0 0 0px var(--phosphor-green); }
        }
        .pulse-active { animation: border-pulse 0.4s ease-out; }

        h2.module-title { color: var(--warning-orange); text-transform: uppercase; letter-spacing: 3px; border-bottom: 1px solid #333; padding-bottom: 8px; font-size: 1rem; margin-top: 40px;}
        .sub-role { color: var(--plasma-cyan); font-weight: bold; font-size: 1.1rem; display: block; margin-top: 20px;}
        .date-tag { color: #888; font-size: 0.85rem; margin-bottom: 8px; display: block; }
        ul { list-style: none; padding: 0; }
        li::before { content: ">> "; color: var(--current-beam-color); }
        li { margin-bottom: 10px; font-size: 0.95rem; line-height: 1.6; }
        .pub-box { background: rgba(255,255,255,0.03); padding: 10px; border-left: 2px solid var(--extraction-purple); margin-bottom: 8px; font-size: 0.85rem; transition: 0.3s; }
        .btn-game {
            display: inline-block; padding: 12px 25px; border: 1px solid var(--bc, var(--warning-orange));
            color: var(--bc, var(--warning-orange)); text-decoration: none; font-weight: bold; transition: all 0.3s ease; margin-top: 15px; font-size: 0.85rem;
        }

        #guest-line { margin: 0 0 6px; font-size: 0.85rem; color: var(--phosphor-green); }
        #guest-line img { width: 20px; height: 15px; vertical-align: -2px; margin-right: 6px; border: 1px solid #333; }
        #guest-line b { color: #fff; }
        .hobby-chamber { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; padding: 15px; background: rgba(0, 255, 255, 0.02); border: 1px dashed #333; border-radius: 8px; }
        .hobby-atom { padding: 6px 14px; border: 1px solid #444; border-radius: 20px; font-size: 0.75rem; cursor: crosshair; transition: 0.3s; background: #000; user-select: none; }
        .hobby-atom.ionized { border-color: var(--plasma-cyan); color: #fff; box-shadow: 0 0 15px var(--plasma-cyan); transform: scale(1.1); background: rgba(0, 255, 255, 0.1); }
        #hobby-readout { width: 100%; margin-top: 12px; font-size: 0.7rem; color: var(--phosphor-green); min-height: 1.2rem; font-family: 'Fira Code', monospace; }

        @keyframes flicker {
            0% { opacity: 1; }
            50% { opacity: 0.8; }
            100% { opacity: 1; }
        }

        /* --- MOBILE & TABLET RESPONSIVE CSS --- */
        @media (max-width: 850px) {
            .container { padding: 180px 15px 100px; }
            .lab-card { padding: 20px; margin-bottom: 30px; }
            h1 { font-size: 2rem !important; }
            .sub-role { font-size: 1rem; }
            #control-panel { top: auto !important; bottom: 20px !important; left: 10px !important; z-index: 100000; }
            #diagnostic-hud { display: none !important; } /* Hide complex canvas HUD on tiny screens to save space */
            .btn-game { display: block; text-align: center; margin-bottom: 10px; }
            #initialize-button { font-size: 0.9rem; padding: 15px 25px; }
        }

        /* Disable Custom Particle Cursor on Touch Devices */
        @media (hover: none) and (pointer: coarse) {
            #ring-cusp-cursor { display: none !important; }
        }

    </style>
    <script src="/Dossier/profile.js"></script>
</head>
<body>
    <div id="video-intro-container">
        <video id="intro-video" playsinline autoplay muted loop>
            <source src="assets/video/IonSource.mp4" type="video/mp4">
        </video>
        <div id="crt-filter"></div>
        <div id="enter-system-overlay">
            <button id="initialize-button">[ INITIALIZE_SYSTEM ]</button>
            <div id="boot-log" aria-live="polite"></div>
            <p style="color: var(--phosphor-green); font-size: 0.6rem; margin-top: 20px; letter-spacing: 1px; opacity: 0.3;"></p>
        </div>
    </div>

    <canvas id="bg-canvas"></canvas>
    <div id="ui-grid"></div>
    
    <div id="control-panel">
        <div style="color:var(--plasma-cyan); font-size:0.6rem; font-weight:bold; margin-bottom:10px; cursor: move;">[ ION_SOURCE_CONTROL ]</div>
        <label style="font-size:0.55rem;">EXTRACTION_V: <span id="v-val">5.0</span> kV</label>
        <input type="range" id="v-slider" min="1" max="10" step="0.1" value="5">
      
        <label style="font-size:0.55rem; color:var(--warning-orange);">NEUTRALIZER_I: <span id="i-val">0.0</span> mA</label>
        <input type="range" id="i-slider" min="0" max="10" step="0.1" value="0">

        <button id="tour-btn">▶ GUIDED_TOUR</button>

        <div id="wear-readout">

        <script>
        (function () {
            const P = window.PROFILE, $ = id => document.getElementById(id);
            // one colour per link button so neighbouring links stay distinct
            const LINK_COLORS = ['var(--plasma-cyan)', 'var(--warning-orange)', 'var(--extraction-purple)', 'var(--phosphor-green)', 'var(--magnet-north)'];
            const entries = list => cvMap(list, e => `
                <span class="sub-role">${e.role} | ${e.org}</span>
                <span class="date-tag">${e.dates}</span>
                <ul>${cvMap(e.bullets, b => `<li>${b}</li>`)}</ul>`);
            $('cv-hero').innerHTML = `
                <h1 style="font-size: 2.8rem; margin:0;">${P.name}</h1>
                <h3 style="color: var(--plasma-cyan); font-weight: 200; margin-top:5px;">// ${P.title}</h3>
                <p style="color:#ccc;">${P.summary}</p>
                <p id="guest-line" hidden></p>
                ${P.links.map((l, i) => `<a href="${l.url}" target="_blank" rel="noopener" class="btn-game" style="--bc:${LINK_COLORS[i % LINK_COLORS.length]}">${l.label}</a> `).join('')}
                <a href="plain.html" target="_blank" rel="noopener" class="btn-game" style="--bc:#d1d1d1">PLAIN CV / PRINT</a>`;
            $('cv-exp').innerHTML = entries(P.experience);
            $('cv-edu').innerHTML = entries(P.education);
            $('cv-pubs').innerHTML = cvMap(P.publications, p => `<div class="pub-box"><b>${p.venue}:</b> ${p.title}</div>`);
            $('cv-talks').innerHTML = cvMap(P.talks, t => `<div class="pub-box"><b>${t.type}:</b> ${t.text}</div>`);
            $('cv-hobbies').innerHTML = cvMap(P.hobbies, h => `<div class="hobby-atom" data-info="${h.tag}: ${h.detail}">${h.icon} ${h.name}</div>`)
                + `<div id="hobby-readout">// WAITING_FOR_BEAM_PROBE...</div>`;
            $('tech-expertise-section').innerHTML = cvMap(P.skills, s => `<p style="margin-bottom:10px;"><b style="color:var(--plasma-cyan);">${s.label}:</b> ${s.text}</p>`)
                + `<p style="margin-top:15px;"><b style="color:var(--warning-orange);">Core expertise:</b> ${P.expertise}</p>`;

            // visitor greeting: the visitor's own country (+ total visits from GoatCounter)
            (async () => {
                const g = $('guest-line'); if (!g) return;
                try {
                    const ctl = new AbortController(); setTimeout(() => ctl.abort(), 5000);
                    const cc = String((await (await fetch('https://api.country.is/', { signal: ctl.signal })).json()).country || '').toUpperCase();
                    if (!/^[A-Z]{2}$/.test(cc)) return;
                    let name = cc;
                    try { name = new Intl.DisplayNames(['en'], { type: 'region' }).of(cc) || cc; } catch (e) { /* old browser */ }
                    let visits = '';
                    const gc = String(P.goatcounter || '').trim();
                    if (/^[a-z0-9-]+$/i.test(gc)) {
                        try { visits = (await (await fetch(`https://${gc}.goatcounter.com/counter/TOTAL.json`)).json()).count || ''; } catch (e) { /* counter unavailable */ }
                    }
                    g.innerHTML = `<img src="https://flagcdn.com/40x30/${cc.toLowerCase()}.png" alt="">// welcome, visitor from <b>${name}</b>${visits && visits !== '0' ? ` · ${visits} visits` : ''}`;
                    g.hidden = false;
                } catch (e) { /* lookup blocked or offline: keep it hidden */ }
            })();
        })();
        </script>
    </div>

    <script>
        // ─── Setup ───────────────────────────────────────────────
        const bgCanvas = document.getElementById('bg-canvas');
        const bgCtx = bgCanvas.getContext('2d');
        const beamCanvas = document.getElementById('ion-beam-canvas');
        const beamCtx = beamCanvas.getContext('2d');
        const eCanvas = document.getElementById('electron-canvas');
        const eCtx = eCanvas.getContext('2d');
        const eroCtx = document.getElementById('erosion-canvas').getContext('2d');
        const cursor = document.getElementById('ring-cusp-cursor');
        const filament = document.getElementById('neutralizer-filament');
        const hud = document.getElementById('diagnostic-hud');
        const gCtx = document.getElementById('gaussianCanvas').getContext('2d');
        const pCtx = document.getElementById('phaseSpaceCanvas').getContext('2d');
        const panel = document.getElementById('control-panel');

        const gridSpacing = 70;
        const warpRadius = 150;
        const warpStrength = 55;
        const gridOpacity = 0.15;

        let mX = window.innerWidth/2, mY = window.innerHeight/2, bX = mX, bY = mY;
        let beamEnergy = 5.0, neutCurrent = 0.0, isFiring = false;
        let bgParticles = [], pulses = [], beamParticles = [], electrons = [], faradayCups = [];
        let tourActive = false;

        // ─── Placement Logic ───────────────────
        let isDraggingPanel = false;
        let panelOffset = { x: 0, y: 0 };

        window.addEventListener('load', () => {
            // Keep it dynamic so media queries win if needed
            const jukebox = document.getElementById('jukebox-card');
            if(jukebox && window.innerWidth > 850) {
                jukebox.style.top = '20px';
                jukebox.style.right = '20px';
                jukebox.style.left = 'auto';
            }
        });

        // Mouse Dragging
        panel.addEventListener('mousedown', (e) => {
            isDraggingPanel = true;
            panelOffset.x = e.clientX - panel.offsetLeft;
            panelOffset.y = e.clientY - panel.offsetTop;
            panel.style.transition = 'none';
            e.stopPropagation();
        });
        document.addEventListener('mousemove', (e) => {
            if (!isDraggingPanel) return;
            panel.style.left = (e.clientX - panelOffset.x) + 'px';
            panel.style.top = (e.clientY - panelOffset.y) + 'px';
        });
        document.addEventListener('mouseup', () => {
            if (isDraggingPanel) {
                isDraggingPanel = false;
                panel.style.transition = 'transform 0.1s ease-out';
            }
        });

        // Touch Dragging for Mobile
        panel.addEventListener('touchstart', (e) => {
            isDraggingPanel = true;
            panelOffset.x = e.touches[0].clientX - panel.offsetLeft;
            panelOffset.y = e.touches[0].clientY - panel.offsetTop;
            panel.style.transition = 'none';
            e.stopPropagation();
        }, {passive: false});
        document.addEventListener('touchmove', (e) => {
            if (!isDraggingPanel) return;
            panel.style.left = (e.touches[0].clientX - panelOffset.x) + 'px';
            panel.style.top = (e.touches[0].clientY - panelOffset.y) + 'px';
            e.preventDefault(); // Prevent scrolling while dragging
        }, {passive: false});
        document.addEventListener('touchend', () => {
            if (isDraggingPanel) {
                isDraggingPanel = false;
                panel.style.transition = 'transform 0.1s ease-out';
            }
        });

        // ─── Audio Engine & UI Interactions ────────────────────────
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();
        let beamHumOsc = null, beamHumGain = null, beamHumLfo = null;

        function playTick(element) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            // Audio Tick
            const osc = audioCtx.createOscillator();
            const tickGain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1400, audioCtx.currentTime); 
            tickGain.gain.setValueAtTime(0.04, audioCtx.currentTime);
            tickGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
            osc.connect(tickGain);
            tickGain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.04);

            // Visual Pulse
            if (element && element.classList.contains('lab-card')) {
                element.classList.remove('pulse-active');
                void element.offsetWidth; // Trigger reflow
                element.classList.add('pulse-active');
                setTimeout(() => element.classList.remove('pulse-active'), 400);
            }
        }

        function startBeamHum() {
            if (beamHumOsc) return;
            beamHumOsc = audioCtx.createOscillator();
            beamHumGain = audioCtx.createGain();
            beamHumLfo = audioCtx.createOscillator();
            beamHumOsc.type = 'triangle';
            beamHumOsc.frequency.setValueAtTime(100, audioCtx.currentTime);
            beamHumLfo.type = 'sine';
            beamHumLfo.frequency.setValueAtTime(0.8, audioCtx.currentTime);
            const lfoGain = audioCtx.createGain();
            lfoGain.gain.setValueAtTime(4, audioCtx.currentTime);
            beamHumLfo.connect(lfoGain);
            lfoGain.connect(beamHumOsc.frequency);
            beamHumOsc.connect(beamHumGain);
            beamHumGain.connect(audioCtx.destination);
            beamHumGain.gain.setValueAtTime(0, audioCtx.currentTime);
            beamHumGain.gain.linearRampToValueAtTime(0.18, audioCtx.currentTime + 0.12);
            beamHumOsc.start(); beamHumLfo.start();
        }

        function updateBeamHum() {
            if (!beamHumOsc || !beamHumGain) return;
            beamHumOsc.frequency.setTargetAtTime(88 + neutCurrent * 3.2, audioCtx.currentTime, 0.08);
            beamHumGain.gain.setTargetAtTime(0.14 + neutCurrent * 0.028, audioCtx.currentTime, 0.10);
        }

        function stopBeamHum() {
            if (!beamHumGain) return;
            beamHumGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.25);
            setTimeout(() => { if (beamHumOsc) { beamHumOsc.stop(); beamHumLfo.stop(); beamHumOsc = null; beamHumLfo = null; beamHumGain = null; } }, 300);
        }

        // ─── Particles & Drawing ────────────────────────
        for (let i = 0; i < 25; i++) faradayCups.push({ y: 30 + i * 16, current: 0, hitsThisFrame: 0, pulse: 0 });

        class BackgroundParticle {
            constructor() { this.reset(); this.x = Math.random() * bgCanvas.width; }
            reset() { this.x = -10; this.y = Math.random() * bgCanvas.height; this.v = 1.5 + Math.random() * 3; this.a = 0.1 + Math.random() * 0.3; }
            update() { this.x += this.v * (beamEnergy * 0.4); if (this.x > bgCanvas.width) this.reset(); }
            draw() { bgCtx.fillStyle = `rgba(0, 255, 255, ${this.a})`; bgCtx.beginPath(); bgCtx.arc(this.x, this.y, 2.5, 0, Math.PI*2); bgCtx.fill(); }
        }
        for(let i=0; i<80; i++) bgParticles.push(new BackgroundParticle());

        // Aperture y-centers (grid period 18, top:28; magnets cover top + bottom apertures)
        const APERTURE_CENTERS = [55, 73, 91, 109, 127, 145];
        class BeamParticle {
            constructor() { this.reset(); }
            reset() {
                const apY = APERTURE_CENTERS[Math.floor(Math.random() * APERTURE_CENTERS.length)];
                this.x = 134 + Math.random() * 2;          // emit at screen-grid front face
                this.y = apY + (Math.random() - 0.5) * 6;  // jitter inside aperture
                const divAngle = (Math.max(2, 45 - (neutCurrent * 4.3)) * 0.018);
                const angle = (Math.random() - 0.5) * divAngle;
                const speed = 3.5 + beamEnergy * 0.5 + Math.random() * 1.0;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed * 0.4;
                this.life = 1.0;
                this.hue = 180 + neutCurrent * 25;
                this.passedAccel = false;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                if (!this.passedAccel && this.x > 152) {
                    // Screen→accel potential drop accelerates the ion
                    this.vx *= (1.45 + beamEnergy * 0.04);
                    this.passedAccel = true;
                }
                this.life -= 0.012;
                if (this.life <= 0 || this.x > 400) this.reset();
            }
            draw() {
                const alpha = this.life * 0.85;
                beamCtx.fillStyle = `hsla(${this.hue}, 100%, 75%, ${alpha})`;
                beamCtx.beginPath(); beamCtx.arc(this.x, this.y, 1.6, 0, Math.PI*2); beamCtx.fill();
            }
        }
        for(let i=0; i<220; i++) beamParticles.push(new BeamParticle());

        // ─── Persistent sputter erosion (CEX-style pitting on accel grid) ─────
        const SPUTTER_KEY = 'pybemcs_sputter_v1';
        const IONS_KEY    = 'pybemcs_ions_v1';
        const MAX_PITS    = 220;
        let sputterPits = [];
        let totalIonsDeposited = 0;
        let erosionDirty = true;
        let lastWearSave = 0;
        try {
            sputterPits = JSON.parse(localStorage.getItem(SPUTTER_KEY) || '[]');
            totalIonsDeposited = parseInt(localStorage.getItem(IONS_KEY) || '0', 10);
        } catch (e) { sputterPits = []; totalIonsDeposited = 0; }

        function generateSputterPit() {
            // Pick a random period (8 periods of 18px from y=28), web region only
            const periodIdx = Math.floor(Math.random() * 8);
            const useUpperWeb = Math.random() < 0.5;
            const yWithinWeb = useUpperWeb ? Math.random() * 5 : 13 + Math.random() * 5;
            const y = 28 + periodIdx * 18 + yWithinWeb;
            const x = 146 + Math.random() * 5;
            return { x, y };
        }

        function addSputterEvent() {
            const p = generateSputterPit();
            const near = sputterPits.find(q => Math.abs(q.x - p.x) < 4 && Math.abs(q.y - p.y) < 3);
            if (near) {
                near.severity = Math.min(1, near.severity + 0.06);
            } else if (sputterPits.length < MAX_PITS) {
                sputterPits.push({ x: p.x, y: p.y, severity: 0.18 });
            }
            erosionDirty = true;
        }

        function drawErosion() {
            if (!erosionDirty) return;
            eroCtx.clearRect(0, 0, 400, 200);
            sputterPits.forEach(p => {
                const r = 1 + p.severity * 2.2;
                eroCtx.beginPath(); eroCtx.arc(p.x, p.y, r + 0.6, 0, Math.PI*2);
                eroCtx.strokeStyle = `rgba(255,140,80,${0.30 + 0.45 * p.severity})`;
                eroCtx.lineWidth = 0.7; eroCtx.stroke();
                eroCtx.beginPath(); eroCtx.arc(p.x, p.y, r, 0, Math.PI*2);
                eroCtx.fillStyle = `rgba(20,10,5,${0.55 + 0.4 * p.severity})`;
                eroCtx.fill();
            });
            erosionDirty = false;
        }

        function updateWearUI() {
            const wearEl = document.getElementById('wear-pct');
            const ionsEl = document.getElementById('ions-tot');
            if (wearEl) wearEl.innerText = (sputterPits.length / MAX_PITS * 100).toFixed(1);
            if (ionsEl) ionsEl.innerText = totalIonsDeposited.toLocaleString();
        }

        function maybeSaveWear() {
            const now = performance.now();
            if (now - lastWearSave < 3000) return;
            lastWearSave = now;
            try {
                localStorage.setItem(SPUTTER_KEY, JSON.stringify(sputterPits));
                localStorage.setItem(IONS_KEY, String(totalIonsDeposited));
            } catch (e) {}
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') {
                try {
                    localStorage.setItem(SPUTTER_KEY, JSON.stringify(sputterPits));
                    localStorage.setItem(IONS_KEY, String(totalIonsDeposited));
                } catch (e) {}
            }
        });

        // Initial render of any persisted wear
        drawErosion(); updateWearUI();

        class Electron {
            constructor() { this.reset(); }
            reset() { this.x = 94; this.y = 80 + Math.random() * 40; this.vx = 7 + Math.random() * 10; this.vy = (Math.random() - 0.5) * 5; this.life = 1.0; }
            update() { this.x += this.vx; this.vy += (100 - this.y) * 0.08; this.y += this.vy + (Math.random()-0.5)*3; this.life -= 0.02; if (this.life <= 0 || this.x > 400) this.reset(); }
            draw() { eCtx.fillStyle = `rgba(255, 241, 118, ${this.life})`; eCtx.beginPath(); eCtx.arc(this.x, this.y, 1.8, 0, Math.PI*2); eCtx.fill(); }
        }
        for(let i=0; i<70; i++) electrons.push(new Electron());

        function drawMagneticGrid() {
            bgCtx.strokeStyle = `rgba(0, 255, 255, ${gridOpacity})`; bgCtx.lineWidth = 0.5;
            for (let x = 0; x <= bgCanvas.width; x += gridSpacing) {
                bgCtx.beginPath();
                for (let y = 0; y <= bgCanvas.height; y += 30) {
                    const dx = mX - x; const dy = mY - y; const dist = Math.sqrt(dx * dx + dy * dy);
                    const warp = dist < warpRadius ? (1 - dist / warpRadius) * warpStrength : 0;
                    bgCtx.lineTo(x + (dx / dist || 0) * warp, y + (dy / dist || 0) * warp);
                }
                bgCtx.stroke();
            }
        }

        function drawAnnihilation() {
            if (Math.random() < 0.015) pulses.push({ x: Math.random() * bgCanvas.width, y: Math.random() * bgCanvas.height, r: 0, a: 0.5 });
            pulses.forEach((p, i) => {
                p.r += 2.5; p.a -= 0.01; if (p.a <= 0) pulses.splice(i, 1);
                bgCtx.beginPath(); bgCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                bgCtx.strokeStyle = `rgba(188, 19, 254, ${p.a})`; bgCtx.lineWidth = 2; bgCtx.stroke();
            });
        }

        function drawDiagnostics(div) {
            gCtx.clearRect(0, 0, 180, 40); gCtx.strokeStyle = '#00ff41'; gCtx.beginPath();
            const sigma = div / 2.2;
            for (let x = 0; x < 180; x++) {
                const val = 32 * Math.exp(-Math.pow(x - 90, 2) / (2 * Math.pow(sigma, 2)));
                gCtx.lineTo(x, 38 - val + (Math.random()*2));
            }
            gCtx.stroke();
            pCtx.clearRect(0, 0, 180, 50); pCtx.strokeStyle = '#00ff41'; pCtx.beginPath();
            pCtx.ellipse(90, 25, 30, 5 + (div/4), div*0.01, 0, Math.PI * 2); pCtx.stroke();
        }

        function animate() {
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
            drawMagneticGrid(); drawAnnihilation();
            bgParticles.forEach(p => { p.update(); p.draw(); });
            bX += (mX - bX) * 0.15; bY += (mY - bY) * 0.15;
            cursor.style.left = bX + 'px'; cursor.style.top = bY + 'px';
            beamCtx.clearRect(0, 0, 400, 200); eCtx.clearRect(0, 0, eCanvas.width, eCanvas.height);
            drawErosion();
            const divergence = Math.max(2, 45 - (neutCurrent * 4.3));
            faradayCups.forEach(cup => { cup.hitsThisFrame = 0; });
            if (isFiring) {
                const emitRate = 3 + Math.floor(beamEnergy * 0.8) + Math.floor(neutCurrent * 1.2);
                for (let i = 0; i < emitRate; i++) beamParticles[i % beamParticles.length].reset();
                beamParticles.forEach(p => {
                    p.update(); p.draw();
                    if (p.x >= 385 && p.life > 0.1) {
                        const cupIndex = Math.floor((p.y - 20) / 16);
                        if (cupIndex >= 0 && cupIndex < 25) { faradayCups[cupIndex].hitsThisFrame++; faradayCups[cupIndex].pulse = 1.0; }
                    }
                });

                // Accumulate ion count + occasional CEX sputter event on accel grid
                totalIonsDeposited += emitRate;
                if (Math.random() < 0.045 + neutCurrent * 0.004) addSputterEvent();
                maybeSaveWear();
                updateWearUI();
                if (neutCurrent > 0) {
                    const activeCount = Math.floor(neutCurrent * 7);
                    for(let i=0; i<activeCount; i++) { electrons[i].update(); electrons[i].draw(); }
                }
                drawDiagnostics(divergence); updateBeamHum();
                faradayCups.forEach((cup, i) => {
                    cup.current = cup.current * 0.92 + cup.hitsThisFrame * 0.12;
                    let r = Math.min(255, cup.current * 80); let g = Math.min(255, 255 - cup.current * 40);
                    beamCtx.fillStyle = `rgb(${r},${g},0)`; beamCtx.fillRect(385, cup.y, 12, 14);
                    if (cup.pulse > 0.05) { beamCtx.strokeStyle = `rgba(0,255,65,${cup.pulse})`; beamCtx.strokeRect(383, cup.y-2, 16, 18); cup.pulse *= 0.82; }
                    if(i % 3 === 0) { beamCtx.fillStyle = cup.current > 2 ? '#000' : '#00ff41'; beamCtx.fillText(cup.current.toFixed(1), 400, cup.y + 10); }
                });
            }
            requestAnimationFrame(animate);
        }

        // ─── Interactions & Event Listeners ───────────────────
        window.addEventListener('pointermove', (e) => {
            if (tourActive) return;
            mX = e.clientX; mY = e.clientY;
            if (!isDraggingPanel) {
                const xVal = (mX - window.innerWidth / 2) / (window.innerWidth / 2);
                const yVal = (mY - window.innerHeight / 2) / (window.innerHeight / 2);
                const targets = document.querySelectorAll('.lab-card, #control-panel');
                targets.forEach(t => { t.style.transform = `perspective(1000px) rotateX(${-yVal * 5}deg) rotateY(${xVal * 5}deg)`; });
            }
            const el = document.elementFromPoint(mX, mY);
            cursor.classList.toggle('hidden', !!el?.closest('a, button, input, #control-panel, .btn-game, #jukebox-card'));
        });

        document.querySelectorAll('.lab-card, .module-title').forEach(item => {
            item.addEventListener('mouseenter', () => playTick(item));
        });

        window.addEventListener('pointerdown', (e) => {
            if (tourActive) return;
            if(!e.target.closest('#control-panel, .lab-card, .btn-game, #jukebox-card, #video-intro-container')) {
                isFiring = true; hud.classList.add('active'); if (audioCtx.state === 'suspended') audioCtx.resume(); startBeamHum();
            }
        });

        window.addEventListener('pointerup', () => { if (tourActive) return; isFiring = false; hud.classList.remove('active'); stopBeamHum(); });

        const root = document.documentElement;
        function updatePlasmaCSSVars() {
            // V=1 → 0.50, V=10 → 1.00 ; I=0 → hue 275 (violet), I=10 → hue 200 (cyan)
            root.style.setProperty('--plasma-intensity', Math.min(1, 0.45 + beamEnergy * 0.055).toFixed(2));
            root.style.setProperty('--plasma-hue', (275 - neutCurrent * 7.5).toFixed(0));
        }
        document.getElementById('v-slider').oninput = (e) => {
            beamEnergy = parseFloat(e.target.value); document.getElementById('v-val').innerText = beamEnergy.toFixed(1);
            updatePlasmaCSSVars();
        };
        document.getElementById('i-slider').oninput = (e) => {
            neutCurrent = parseFloat(e.target.value); document.getElementById('i-val').innerText = neutCurrent.toFixed(1);
            if (filament) {
                filament.style.background = neutCurrent > 0 ? `rgb(255, ${180 + neutCurrent*7}, 50)` : "#333";
                filament.style.boxShadow  = neutCurrent > 0 ? `0 0 ${neutCurrent * 8}px var(--warning-orange)` : "none";
            }
            updatePlasmaCSSVars();
        };
        updatePlasmaCSSVars();

        document.getElementById('reset-chamber-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            sputterPits = [];
            totalIonsDeposited = 0;
            erosionDirty = true;
            try {
                localStorage.removeItem(SPUTTER_KEY);
                localStorage.removeItem(IONS_KEY);
            } catch (err) {}
            drawErosion();
            updateWearUI();
            playTick();
        });

        // Added touch support to the hobby atoms
        document.querySelectorAll('.hobby-atom').forEach(atom => {
            const handleHover = () => {
                document.querySelectorAll('.hobby-atom').forEach(a => a.classList.remove('ionized'));
                atom.classList.add('ionized'); playTick();
                document.getElementById('hobby-readout').innerText = `>  ${atom.getAttribute('data-info')}`; 
            };
            atom.addEventListener('mouseenter', handleHover);
            atom.addEventListener('touchstart', handleHover, {passive: true});
            atom.addEventListener('mouseleave', () => { atom.classList.remove('ionized'); document.getElementById('hobby-readout').innerText = "// WAITING_FOR_BEAM_PROBE..."; });
        });

        function resize() { bgCanvas.width = window.innerWidth; bgCanvas.height = window.innerHeight; }
        window.onresize = resize; resize(); animate();

        const introContainer = document.getElementById('video-intro-container');
        const introVideo = document.getElementById('intro-video');
        const initBtn = document.getElementById('initialize-button');
        const bootLog = document.getElementById('boot-log');

        const BOOT_LINES = [
            ["CHAMBER VACUUM",   "4.2e-6 Torr"],
            ["PROPELLANT FLOW",  "12 sccm Xe"],
            ["CATHODE HEATER",   "1450 K"],
            ["DISCHARGE PSU",    "28 V / 4.2 A"],
            ["SCREEN GRID HV",   "+1500 V"],
            ["ACCEL GRID HV",    "-250 V"],
            ["NEUTRALIZER",      "ON"],
            ["INTERLOCKS",       "CLEAR"]
        ];

        const sleep = ms => new Promise(r => setTimeout(r, ms));

        function playIgnitionThump() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(140, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.55);
            g.gain.setValueAtTime(0.18, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
            osc.connect(g); g.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.62);
        }

        function appendBootLine(idx, label, value) {
            const total = BOOT_LINES.length;
            const padLabel = label.padEnd(18, ' ');
            const dots = '.'.repeat(Math.max(2, 22 - value.length));
            const line = document.createElement('div');
            line.className = 'boot-line';
            line.innerHTML =
                `<span class="boot-prefix">[ ${String(idx).padStart(2,'0')}/${String(total).padStart(2,'0')} ]</span> ` +
                `<span class="boot-label">${padLabel}</span>` +
                `<span class="boot-dots">${dots}</span> ` +
                `<span class="boot-value">${value}</span>` +
                `<span class="boot-ok">[OK]</span>`;
            bootLog.appendChild(line);
        }

        let bootRunning = false;
        async function runBootSequence() {
            if (bootRunning) return;
            bootRunning = true;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            initBtn.style.display = 'none';
            bootLog.classList.add('active');
            for (let i = 0; i < BOOT_LINES.length; i++) {
                appendBootLine(i + 1, BOOT_LINES[i][0], BOOT_LINES[i][1]);
                playTick();
                await sleep(150 + Math.random() * 100);
            }
            const ignition = document.createElement('div');
            ignition.className = 'boot-line boot-ignition';
            ignition.textContent = '>> IGNITION ARMED — WELCOME, OPERATOR.';
            bootLog.appendChild(ignition);
            playIgnitionThump();
            await sleep(900);
            introContainer.classList.add('preloader-hidden');
            setTimeout(() => { introVideo.pause(); }, 1200);
        }

        initBtn.addEventListener('click', runBootSequence);

        window.addEventListener('keydown', (e) => { if (e.key.toLowerCase() === 's') introContainer.classList.add('preloader-hidden'); });

        // ─── GUIDED TOUR ──────────────────────────────────────────
        const tourCaption = document.getElementById('tour-caption');
        const tourCaptionText = document.getElementById('tour-caption-text');
        const tourBtn = document.getElementById('tour-btn');

        const TOUR_STEPS = [
            {
                sel: '.container .lab-card',
                scroll: true,
                text: 'Welcome — your operator for this beam line. The cursor is a multicusp ion source: cyan beam, magnets, neutralizer filament. Move it around to warp the magnetic field.',
                wait: 3500
            },
            {
                sel: '#v-slider',
                text: 'EXTRACTION_V controls beam energy. Watch the plume sharpen as it ramps up...',
                action: 'tweak-v', targetVal: 9, wait: 1600
            },
            {
                sel: '#i-slider',
                text: 'NEUTRALIZER_I adds electrons from the hot filament. The beam tightens, divergence drops, hue shifts gold.',
                action: 'tweak-i', targetVal: 7, wait: 1600
            },
            {
                center: true,
                text: 'Hold-click anywhere outside the panels to fire ions at a Faraday cup array. Cups light up by deposited current.',
                action: 'auto-fire', wait: 2400
            },
            {
                sel: '.hobby-chamber',
                scroll: true,
                text: 'Hobbies — click the ♟ CHESS atom for a knight L-jump easter egg. The other atoms ionise on hover.',
                wait: 3200
            },
            {
                sel: '.container .lab-card',
                scroll: true,
                text: 'Tour complete. Beam is yours — explore freely.',
                wait: 2000
            }
        ];

        function showCaption(text) {
            tourCaptionText.innerText = ' ' + text;
            tourCaption.classList.add('visible');
        }
        function hideCaption() {
            tourCaption.classList.remove('visible');
        }

        function tweenCursor(targetX, targetY, duration = 900) {
            return new Promise(resolve => {
                const startX = mX, startY = mY;
                const t0 = performance.now();
                (function step() {
                    if (!tourActive) return resolve();
                    const t = Math.min(1, (performance.now() - t0) / duration);
                    const e = 0.5 - 0.5 * Math.cos(Math.PI * t);
                    mX = startX + (targetX - startX) * e;
                    mY = startY + (targetY - startY) * e;
                    if (t < 1) requestAnimationFrame(step); else resolve();
                })();
            });
        }

        function tweenSlider(id, target, duration = 1100) {
            const slider = document.getElementById(id);
            const startVal = parseFloat(slider.value);
            const t0 = performance.now();
            return new Promise(resolve => {
                (function step() {
                    if (!tourActive) return resolve();
                    const t = Math.min(1, (performance.now() - t0) / duration);
                    const e = 0.5 - 0.5 * Math.cos(Math.PI * t);
                    slider.value = (startVal + (target - startVal) * e).toFixed(2);
                    slider.dispatchEvent(new Event('input', { bubbles: true }));
                    if (t < 1) requestAnimationFrame(step); else resolve();
                })();
            });
        }

        async function runTour() {
            if (tourActive) return;
            tourActive = true;
            document.body.classList.add('tour-active');
            tourBtn.classList.add('tour-running');
            tourBtn.innerText = '■ STOP_TOUR';

            for (const step of TOUR_STEPS) {
                if (!tourActive) break;

                let tx, ty;
                if (step.center) {
                    tx = window.innerWidth * 0.55;
                    ty = window.innerHeight * 0.5;
                } else {
                    const el = document.querySelector(step.sel);
                    if (!el) continue;
                    if (step.scroll) {
                        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        await sleep(750);
                    }
                    const r = el.getBoundingClientRect();
                    tx = r.left + r.width / 2;
                    ty = r.top + r.height / 2;
                }

                await tweenCursor(tx, ty, 900);
                if (!tourActive) break;
                showCaption(step.text);

                if (step.action === 'tweak-v') await tweenSlider('v-slider', step.targetVal, 1100);
                else if (step.action === 'tweak-i') await tweenSlider('i-slider', step.targetVal, 1100);
                else if (step.action === 'auto-fire') {
                    isFiring = true; hud.classList.add('active'); startBeamHum();
                    await sleep(step.wait);
                    isFiring = false; hud.classList.remove('active'); stopBeamHum();
                    continue;
                }
                if (!tourActive) break;
                await sleep(step.wait);
            }

            hideCaption();
            document.body.classList.remove('tour-active');
            tourBtn.classList.remove('tour-running');
            tourBtn.innerText = '▶ GUIDED_TOUR';
            tourActive = false;
        }

        function abortTour() {
            if (!tourActive) return;
            tourActive = false;
            isFiring = false; hud.classList.remove('active'); stopBeamHum();
            hideCaption();
            document.body.classList.remove('tour-active');
            tourBtn.classList.remove('tour-running');
            tourBtn.innerText = '▶ GUIDED_TOUR';
        }

        tourBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (tourActive) abortTour(); else runTour();
        });
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && tourActive) abortTour();
        });

        // ─── CHESS KNIGHT EASTER EGG ──────────────────────────────
        const chessAtom = Array.from(document.querySelectorAll('.hobby-atom'))
            .find(a => /CHESS/i.test(a.textContent));
        if (chessAtom) {
            let knightCooldown = false;
            const launchKnight = (e) => {
                if (knightCooldown) return;
                knightCooldown = true;
                chessAtom.classList.add('knight-cooldown');

                const rect = chessAtom.getBoundingClientRect();
                const startX = rect.left + rect.width / 2;
                const startY = rect.top + rect.height / 2;

                const ghost = document.createElement('div');
                ghost.className = 'knight-ghost';
                ghost.textContent = '♞';
                ghost.style.left = (startX - 14) + 'px';
                ghost.style.top  = (startY - 22) + 'px';
                document.body.appendChild(ghost);

                // Trail dots tracing the L-path: 8 along x, then 5 going up
                const trail = [];
                for (let i = 1; i <= 8; i++) trail.push({ x: startX + (190 / 8) * i, y: startY,            d: 60 * i });
                for (let i = 1; i <= 5; i++) trail.push({ x: startX + 190,           y: startY - (110/5)*i, d: 540 + 80 * i });
                trail.forEach(p => {
                    setTimeout(() => {
                        const dot = document.createElement('div');
                        dot.className = 'knight-trail-dot';
                        dot.style.left = (p.x - 3) + 'px';
                        dot.style.top  = (p.y - 3) + 'px';
                        document.body.appendChild(dot);
                        setTimeout(() => dot.remove(), 1200);
                    }, p.d);
                });

                // Knight clop: square wave dropping 220 → 60 Hz
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.18);
                g.gain.setValueAtTime(0.07, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.22);
                osc.connect(g); g.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.24);

                document.getElementById('hobby-readout').innerText =
                    '> KNIGHT_JUMP: L-trajectory executed · ELO 1900 confirmed';

                setTimeout(() => {
                    ghost.remove();
                    knightCooldown = false;
                    chessAtom.classList.remove('knight-cooldown');
                }, 1700);
            };
            chessAtom.addEventListener('click', launchKnight);
        }
    </script>
</body>
</html>
