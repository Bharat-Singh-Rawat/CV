name: Update visitor stats

on:
  schedule:
    - cron: "17 */3 * * *"      # every 3 hours
  workflow_dispatch: {}          # allow a manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: visitor-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch stats from GoatCounter
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: python3 scripts/fetch_visitor_stats.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/stats/visitors.json; then echo "nothing to commit"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats/visitors.json
          git commit -m "Update visitor stats"
          git push
